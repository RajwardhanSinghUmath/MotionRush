name: Controller checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install verified dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test controller without hardware input
        run: python -B -m unittest discover -s tests -v
      - name: Load the actual bundled pose model
        run: python -B test_mp.py
      - name: Check native global controls without input injection
        run: python -B -m evaluation.check_global_controls
